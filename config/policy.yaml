# Rakshak privacy policy. Simple "key: value" lines (read by rakshak/pipeline.py).
qi_mode: adaptive              # mask | fixed | adaptive  (adaptive = patient-level pooled risk control)
age_band_years: 5              # base band width; every band always CONTAINS the true age
date_shift_max_days: 180       # per-patient secret date shift (HMAC of RAKSHA_SECRET); intervals & stay lengths stay exact
min_group_size: 5              # pooled-profile equivalence class below this -> escalate generalisation
rare_condition_max_patients: 3 # a condition shared by <= this many patients is "rare" -> escalate that patient
escalate_dob: drop             # escalated patients: DOB removed (birth year is the strongest re-identifier)
pin_mode: drop                 # PIN codes removed (3-digit prefixes narrowed the register to ~1 candidate)
consistent_bands: on           # one truthful band per patient across all records (no intersection leak)
