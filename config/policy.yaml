# Your privacy rules. main.py reads simple "key: value" lines.
age_band_years: 5          # ages become bands like 45-49 (the band must contain the true age)
date_shift_max_days: 180   # every date of one patient moves by the same secret offset
min_group_size: 5          # TODO: suppress or widen quasi-identifier combos rarer than this (k-anonymity)
qi_mode: adaptive              # mask | fixed | adaptive (patient-level risk control)
rare_condition_max_patients: 3 # a condition shared by <= this many patients is "rare" (attacker weights it x8)
